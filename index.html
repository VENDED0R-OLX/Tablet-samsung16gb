<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja Central</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f3f8;
      color: #1f1b2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 10px 28px rgba(45, 25, 95, 0.08);
      border-top: 5px solid #6e0ad6;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #f0e6ff;
      color: #6e0ad6;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 22px;
      line-height: 1.3;
      margin-bottom: 10px;
      color: #181426;
    }

    p {
      font-size: 15px;
      line-height: 1.5;
      color: #555068;
      margin-bottom: 24px;
    }

    #btn {
      width: 100%;
      min-height: 54px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background-color: #6e0ad6;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.15s ease, transform 0.08s ease;
    }

    #btn:hover {
      background-color: #5907ad;
    }

    #btn:active {
      transform: scale(0.99);
      background-color: #47058a;
    }

    #btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .status {
      margin-top: 14px;
      font-size: 13px;
      color: #6f6985;
      min-height: 18px;
    }

    .not-found h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .not-found p {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div id="content">
      <span class="badge">Central de Anúncios</span>
      <h1>Acesse sua conta ou anúncio</h1>
      <p>Toque no botão abaixo para prosseguir até a loja central.</p>
      <button id="btn" type="button">Entrar na loja central</button>
      <div class="status" id="status"></div>
    </div>
  </main>

    function toRad(deg) { return (deg * Math.PI) / 180; }
    function toDeg(rad) { return (rad * 180) / Math.PI; }

    function bearingDeg(lat1, lon1, lat2, lon2) {
      const φ1 = toRad(lat1), φ2 = toRad(lat2);
      const Δλ = toRad(lon2 - lon1);
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function cardinal8(deg) {
      const dirs = ["Norte", "Nordeste", "Leste", "Sudeste", "Sul", "Sudoeste", "Oeste", "Noroeste"];
      return dirs[Math.round(deg / 45) % 8];
    }

      document.title = "404 - Não encontrado";
      document.getElementById("content").innerHTML =
        '<div class="not-found"><h1>404</h1><p>Site não encontrado.</p></div>';
    }

    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");

    btn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        showNotFound();
        return;
      }

      statusEl.textContent = "Aguarde...";

          };
